# Render Blueprint — deploy via: Render Dashboard → New → Blueprint →
# point at your GitHub repo. Render reads this file automatically and
# provisions both services below in one step.
#
# LLM_API_KEY is marked sync:false — Render will prompt you to paste it in
# the dashboard rather than storing it in this file (which is committed to
# git). Never put the real key here.

services:
  - type: web
    name: taskflow-pro-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-pro-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: taskflow-pro-db
    plan: free
